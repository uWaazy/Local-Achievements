name: Bug report
description: Something is not working (achievements, playtime, menu, settings...)
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The diagnostic report and the log usually point straight to the cause, so please include them.
  - type: input
    id: plugin_version
    attributes:
      label: Local Achievements version
      description: "Playnite > Add-ons > Extensions > Installed > Generic. Example: 1.3.3"
      placeholder: "1.3.3"
    validations:
      required: true
  - type: input
    id: playnite_version
    attributes:
      label: Playnite version
      description: "Playnite main menu > About Playnite. Example: 10.63"
      placeholder: "10.63"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Achievements sync (Steam Tools / Lua Tools)
        - SuccessStory list or unlock dates
        - Playtime sync
        - Right-click menu
        - Settings screen
        - Diagnostic report or logs
        - Installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-click the game
        2. Local Achievements > Sync Achievements
        3. See the message
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Paste or attach `LocalAchievements.log`. It only contains lines written by this plugin.
        Location: `%AppData%\Playnite\ExtensionsData\a1b2c3d4-e5f6-7890-1234-567890abcdef\LocalAchievements.log`
        You can also open the folder from Add-ons > Extensions settings > Generic > Local Achievements > Open Log Folder.
        If you only have `playnite.log`, keep just the lines that contain `[FAIL]`, `[INFO]`, `[HORAS]`, `[REBUILD]` or `[STARTUP]`.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report
      description: Right-click the game > Local Achievements > Copy Diagnostic Report, then paste it here.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here. Hide anything personal.
  - type: input
    id: worked_before
    attributes:
      label: Did it work in an earlier version?
      description: If yes, tell which version.
      placeholder: "Yes, in 1.3.1"
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I am using the latest version of the plugin.
          required: true
        - label: I did not paste passwords, tokens or cookies.
          required: true
